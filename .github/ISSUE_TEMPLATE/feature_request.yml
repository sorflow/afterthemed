name: Feature request
description: Propose a focused improvement to AfterThemed
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the result and interaction, not only the implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DVAUI theming
        - CEP or ScriptUI panels
        - Fonts and typography
        - Backup and restore
        - Import or export
        - Installer
        - Application design
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: rights
    attributes:
      label: Content and compatibility
      options:
        - label: This request does not require distributing Adobe files, fonts, or third-party extension code.
          required: true
